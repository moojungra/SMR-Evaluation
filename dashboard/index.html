<style>

    --good: #1f9d64; --warn: #c2821a; --crit: #cf4d4d; --neutral: #7b8a96;

      --ink: #e6edf3; --ink-2: #94a4b1; --ink-3: #6b7d8a;
      --line: #253039; --line-2: #324150;
      --accent: #3bb6d8; --accent-ink: #80d3ea; --accent-soft: #10303c;
      --gen4: #b093ea; --gen4-soft: #241a38;
      --good: #34c07d; --warn: #dca23e; --crit: #e8706e; --neutral: #8597a3;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0c1116; --surface: #141c24; --surface-2: #1a232c; --surface-3: #202b35;
    --ink: #e6edf3; --ink-2: #94a4b1; --ink-3: #6b7d8a;
    --line: #253039; --line-2: #324150;
    --accent: #3bb6d8; --accent-ink: #80d3ea; --accent-soft: #10303c;
    --gen4: #b093ea; --gen4-soft: #241a38;
    --good: #34c07d; --warn: #dca23e; --crit: #e8706e; --neutral: #8597a3;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  h1,h2,h3 { margin: 0; font-weight: 600; text-wrap: balance; }
  a { color: var(--accent-ink); }
  button { font-family: inherit; cursor: pointer; }

  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .head-wrap { max-width: 1240px; margin: 0 auto; padding: 13px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .logo { width: 34px; height: 34px; flex: none; }
  .brand h1 { font-size: 17px; letter-spacing: -.01em; }
  .brand .sub { font-size: 11.5px; color: var(--ink-2); letter-spacing: .02em; }
  .head-meta { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--ink-2); }
  .pill-updated { font-family: var(--mono); background: var(--surface-2);
    border: 1px solid var(--line); padding: 4px 9px; border-radius: 999px; }
  .icon-btn { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2);
    width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; }
  .icon-btn:hover { color: var(--ink); border-color: var(--line-2); }

  main { max-width: 1240px; margin: 0 auto; padding: 20px 20px 64px; }

  .intro { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px;
    flex-wrap: wrap; margin-bottom: 16px; }
  .intro p { margin: 6px 0 0; color: var(--ink-2); max-width: 64ch; font-size: 13px; }
  .intro h2 { font-size: 21px; letter-spacing: -.015em; }
  .disclaimer { font-size: 12px; color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); padding: 10px 13px;
    border-radius: 10px; max-width: 420px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 16px; box-shadow: var(--shadow); }
  .tile .k { font-size: 11px; color: var(--ink-2); letter-spacing: .03em; }
  .tile .v { font-family: var(--mono); font-size: 25px; font-weight: 600; margin-top: 3px; letter-spacing: -.02em; }
  .tile .v small { font-size: 12px; color: var(--ink-2); font-weight: 500; }

  /* category segmented control */
  .segmented { display: flex; gap: 4px; background: var(--surface-3); padding: 4px; border-radius: 11px;
    flex-wrap: wrap; border: 1px solid var(--line); margin-bottom: 12px; }
  .segmented button { border: 0; background: none; color: var(--ink-2); font-size: 13px; font-weight: 500;
    padding: 7px 14px; border-radius: 8px; white-space: nowrap; }
  .segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink);
    box-shadow: var(--shadow); }
  .segmented button .n { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-left: 5px; }

  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .search { flex: 1 1 180px; min-width: 150px; position: relative; }
  .search input { width: 100%; padding: 8px 12px 8px 32px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); font-family: inherit; font-size: 13px; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
  select.ctl { padding: 8px 11px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); font-family: inherit; font-size: 13px; }
  .gen-chips { display: flex; gap: 6px; }
  .chip { font-size: 12px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink-2); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  :root[data-theme="dark"] .chip[aria-pressed="true"],
  :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: #06222b; }
  .chip.g4[aria-pressed="true"] { background: var(--gen4); border-color: var(--gen4); }
  .toggle { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2);
    margin-left: auto; cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--accent); width: 15px; height: 15px; }
  .count-line { font-size: 12px; color: var(--ink-3); margin: 2px 0 12px; }

  .group-head { display: flex; align-items: baseline; gap: 10px; margin: 20px 0 9px; }
  .group-head h3 { font-size: 14px; letter-spacing: -.01em; }
  .group-head .gc { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
  .group-head .bar-mini { flex: 1; height: 1px; background: var(--line); }

  .list { display: flex; flex-direction: column; gap: 9px; }
  .row { background: var(--surface); border: 1px solid var(--line); border-radius: 13px;
    box-shadow: var(--shadow); overflow: hidden; }
  .row-head { display: grid; grid-template-columns: 32px minmax(180px, 1.5fr) auto 120px 74px 22px;
    align-items: center; gap: 13px; padding: 12px 15px; width: 100%; text-align: left;
    background: none; border: 0; color: inherit; }
  .row-head:hover { background: var(--surface-2); }
  .rank { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--ink-3); text-align: center; }
  .rank.top { color: var(--accent); }
  .r-id .nm { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .r-id .meta { font-size: 11.5px; color: var(--ink-2); margin-top: 2px; }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .tag { font-size: 10.5px; padding: 3px 7px; border-radius: 6px; background: var(--surface-3);
    color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
  .tag.gen { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  .tag.gen.g4 { background: var(--gen4-soft); color: var(--gen4); }
  .tag.fam { font-weight: 500; }
  .tag.op { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); border-color: transparent; }
  .tag.constr { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent-ink); border-color: transparent; }
  .score-cell { display: flex; align-items: center; gap: 9px; }
  .score-num { font-family: var(--mono); font-size: 18px; font-weight: 600; width: 42px; text-align: right; }
  .bar { flex: 1; height: 7px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 4px; }
  .conf { font-size: 10px; font-weight: 600; padding: 3px 7px; border-radius: 999px; text-align: center; letter-spacing: .02em; }
  .conf.high { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
  .conf.medium { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .conf.low { background: color-mix(in srgb, var(--crit) 16%, transparent); color: var(--crit); }
  .caret { color: var(--ink-3); transition: transform .18s ease; justify-self: center; }
  .row[open] .caret { transform: rotate(90deg); }

  .detail { border-top: 1px solid var(--line); padding: 17px 15px; display: none;
    grid-template-columns: 290px 1fr; gap: 22px; background: var(--surface-2); }
  .row[open] .detail { display: grid; }
  .detail .summary { font-size: 13px; color: var(--ink-2); grid-column: 1 / -1; margin: -2px 0 2px; }
  .radar-box { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .radar-box .cap { font-size: 11px; color: var(--ink-3); letter-spacing: .04em; }
  .dim-list { display: flex; flex-direction: column; gap: 8px; }
  .dim { display: grid; grid-template-columns: 104px 48px 1fr; gap: 11px; align-items: start; }
  .dim .dl { font-size: 12.5px; font-weight: 500; }
  .dim .dl small { display: block; font-size: 10px; color: var(--ink-3); font-weight: 400; }
  .dim .lvl { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  .dim .lvl b { color: var(--ink); font-size: 14px; }
  .dim .rat { font-size: 12px; color: var(--ink-2); }
  .src-row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    border-top: 1px dashed var(--line); padding-top: 11px; font-size: 11.5px; color: var(--ink-3); }
  .src-row .s { background: var(--surface-3); border: 1px solid var(--line); padding: 3px 8px; border-radius: 6px; color: var(--ink-2); }

  .live-box { grid-column: 1 / -1; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 13px; margin-top: 2px; }
  .live-box .lh { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600;
    color: var(--ink-2); letter-spacing: .03em; margin-bottom: 8px; }
  .live-box .lh .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
  .live-box .hint { font-size: 11.5px; color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--warn) 28%, transparent); padding: 6px 9px; border-radius: 7px; margin-bottom: 8px; }
  .live-item { display: grid; grid-template-columns: 74px 1fr; gap: 9px; padding: 4px 0; font-size: 12px; align-items: baseline; }
  .live-item .d { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .live-item a { color: var(--ink); text-decoration: none; }
  .live-item a:hover { color: var(--accent-ink); text-decoration: underline; }
  .live-item .sc { color: var(--ink-3); font-size: 10.5px; }
  .review-flag { font-size: 9.5px; font-weight: 700; color: #fff; background: var(--warn);
    padding: 2px 6px; border-radius: 5px; }

  .aris-box { grid-column: 1 / -1; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius: 10px; padding: 11px 13px; margin-top: 8px; }
  .aris-box .lh { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600;
    color: var(--accent-ink); letter-spacing: .03em; margin-bottom: 8px; }
  .ar-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; }
  .ar-k { color: var(--ink-3); }
  .ar-v { color: var(--ink); font-weight: 500; }
  .ar-note { font-size: 10.5px; color: var(--ink-3); margin-top: 8px; }

  .sec { margin: 32px 0 12px; display: flex; align-items: baseline; gap: 12px; }
  .sec h2 { font-size: 16px; letter-spacing: -.01em; }
  .sec .hint { font-size: 12px; color: var(--ink-3); }

  .heat-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); box-shadow: var(--shadow); }
  table.heat { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 12px; }
  table.heat th, table.heat td { padding: 8px 7px; text-align: center; border-bottom: 1px solid var(--line); }
  table.heat thead th { position: sticky; top: 0; background: var(--surface); color: var(--ink-2);
    font-weight: 500; font-size: 11px; z-index: 1; }
  table.heat th.name, table.heat td.name { text-align: left; min-width: 196px; position: sticky; left: 0;
    background: var(--surface); }
  table.heat td.name { font-weight: 500; }
  table.heat td.name small { color: var(--ink-3); font-weight: 400; }
  .cell { width: 40px; height: 32px; border-radius: 7px; display: inline-flex; align-items: center;
    justify-content: center; font-family: var(--mono); font-weight: 600; font-size: 12px; position: relative; }
  .cell .dot { position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; }
  td.ov { font-family: var(--mono); font-weight: 600; font-size: 14px; }
  .heat-cat { font-size: 10px; color: #fff; padding: 1px 6px; border-radius: 5px; font-weight: 600; }

  .sources { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .source { background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
    padding: 12px 14px; box-shadow: var(--shadow); }
  .source .top { display: flex; align-items: center; gap: 8px; }
  .source .nm { font-size: 13px; font-weight: 600; }
  .source .st { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px; margin-left: auto; }
  .source .st.on { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
  .source .st.off { background: var(--surface-3); color: var(--ink-3); }
  .source .note { font-size: 11.5px; color: var(--ink-2); margin: 6px 0 8px; }
  .source .prov { display: flex; flex-wrap: wrap; gap: 4px; }
  .source .prov span { font-size: 10px; background: var(--surface-3); border: 1px solid var(--line);
    padding: 2px 6px; border-radius: 5px; color: var(--ink-3); }

  .legend { display: flex; gap: 15px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-2); margin-top: 10px; }
  .legend .it { display: flex; align-items: center; gap: 6px; }
  .legend .sw { width: 20px; height: 12px; border-radius: 3px; }

  footer { max-width: 1240px; margin: 40px auto 0; padding: 20px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--ink-3); line-height: 1.7; }
  footer b { color: var(--ink-2); }

  @media (max-width: 780px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .row-head { grid-template-columns: 26px 1fr 64px 20px; }
    .row-head .tags, .row-head .conf { display: none; }
    .detail { grid-template-columns: 1fr; }
    .intro h2 { font-size: 19px; }
    .toggle { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

    {"id":"last-energy-pws20","name":"Last Energy PWS-20","vendor":"Last Energy","country":"미국/영국","generation":"Gen III+","category":"마이크로로(MMR)","family":"PWR","coolant":"경수","capacity_mwe_total":20,"capacity_mwe_module":20,"modules":1,"fuel":"LEU","status":"설계·사전발주","foak_target":"2020년대 후반","tags":["마이크로","공장제작"],"summary":"컨테이너형 20MWe 소형 PWR. 검증 PWR 기술로 공장제작·반복배치 지향. 유럽 다수 전력구매 의향(PPA) 체결 보도.","dimensions":{"technology_readiness":{"level":3,"confidence":"low","rationale":"표준 PWR 기반, 자체 실증 전."},"licensing":{"level":2,"confidence":"low","rationale":"각국 인허가 초기."},"economics":{"level":3,"confidence":"low","rationale":"반복배치 저가 지향, 실적 전."},"safety":{"level":3,"confidence":"low","rationale":"소형 PWR, 피동 특성 제한적."},"supply_fuel":{"level":4,"confidence":"low","rationale":"표준 LEU."},"deployment":{"level":2,"confidence":"low","rationale":"PPA 의향 다수, 착공 전."}},"sources":["IAEA ARIS","Last Energy","World Nuclear News"]},
    {"id":"radiant-kaleidos","name":"Radiant Kaleidos","vendor":"Radiant","country":"미국","generation":"Gen IV","category":"마이크로로(MMR)","family":"HTGR","coolant":"가스(이동형)","capacity_mwe_total":1,"capacity_mwe_module":1,"modules":1,"fuel":"HALEU TRISO","status":"설계·시험준비","foak_target":"2020년대 후반 (INL 시험)","tags":["마이크로","이동형"],"summary":"컨테이너 이동형 가스냉각 마이크로로(1.2MWe). INL에서 연료 포함 실증시험 추진, 설계·시험 준비 단계.","dimensions":{"technology_readiness":{"level":3,"confidence":"low","rationale":"TRISO 가스로, 실증 시험 준비."},"licensing":{"level":2,"confidence":"low","rationale":"시험·인허가 초기."},"economics":{"level":2,"confidence":"low","rationale":"오지·분산 특수용도."},"safety":{"level":5,"confidence":"medium","rationale":"TRISO 본질안전·이동형."},"supply_fuel":{"level":2,"confidence":"low","rationale":"HALEU TRISO 공급 과제."},"deployment":{"level":2,"confidence":"low","rationale":"INL 실증 시험 준비."}},"sources":["IAEA ARIS","Radiant","US DOE"]}

<script src="./data.js" onerror="window.__noDataFile=true"></script>
<script>
const LEVEL_TO_SCORE = {1:10, 2:32.5, 3:55, 4:77.5, 5:100};
const CONF_FACTOR = {high:1.0, medium:0.85, low:0.7};
const EMBEDDED = JSON.parse(document.getElementById("smr-embed").textContent);
const DATA = (!window.__noDataFile && window.SMR_DATA) ? window.SMR_DATA : EMBEDDED;
const DIMS = DATA.rubric.dimensions;
const CATS = (DATA.taxonomy && DATA.taxonomy.category) || ["경수로 SMR","비경수로 SMR","마이크로로(MMR)"];
const CAT_COLOR = {"경수로 SMR":"var(--accent)","비경수로 SMR":"var(--gen4)","마이크로로(MMR)":"var(--neutral)"};

function scoreReactor(r){
  let w=0, wSum=0, cSum=0, tally={high:0,medium:0,low:0};
  const dims = DIMS.map(d=>{
    const e=r.dimensions[d.key]; const base=LEVEL_TO_SCORE[e.level];
    w+=d.weight; wSum+=base*d.weight; cSum+=base*d.weight*CONF_FACTOR[e.confidence]; tally[e.confidence]++;
    return {key:d.key,label:d.label,label_en:d.label_en,weight:d.weight,level:e.level,confidence:e.confidence,score:base,rationale:e.rationale};
  });
  const n=tally.high+tally.medium+tally.low||1; let dc="medium";
  if(tally.low/n>=0.4) dc="low"; else if(tally.high/n>=0.5) dc="high";
  return {overall:+(wSum/w).toFixed(1), overallAdj:+(cSum/w).toFixed(1), dataConfidence:dc, dims};
}
function scoreColor(s){ return s>=80?"var(--good)": s>=60?"var(--accent)": s>=40?"var(--warn)":"var(--crit)"; }
function levelAlpha(l){ return {1:.18,2:.36,3:.55,4:.76,5:.96}[l]; }
function statusClass(st){ if(/운전|완공|완료/.test(st)) return "op"; if(/건설|시운전|장전/.test(st)) return "constr"; return ""; }
function capText(r){ return r.capacity_mwe_total>0 ? `${r.capacity_mwe_total}MWe${r.modules>1?` (${r.capacity_mwe_module}×${r.modules})`:''}` : "실험로"; }

const R = DATA.reactors.map(r=>({...r, ev:scoreReactor(r)}));
const state = { q:"", category:null, generation:null, family:"", country:"", sort:"overall", group:false };
const el = id => document.getElementById(id);

el("updated").textContent = "업데이트 " + DATA.meta.updated;
el("disclaimer").textContent = DATA.meta.disclaimer;
if(DATA.collected_at){ const c=el("collected"); c.hidden=false; c.textContent="🔴 자동수집 "+DATA.collected_at.slice(0,10); }

function renderStats(){
  const op = R.filter(r=>/운전/.test(r.status)).length;
  const constr = R.filter(r=>/건설|시운전|장전|제작/.test(r.status)).length;
  const gen4 = R.filter(r=>r.generation==="Gen IV").length;
  const tiles = [
    ["평가 노형", R.length, "개"],
    ["운전 중", op, "개"],
    ["건설·시운전", constr, "개"],
    ["Gen IV 노형", gen4, `/ ${R.length}`],
  ];
  el("stats").innerHTML = tiles.map(([k,v,u])=>
    `<div class="tile"><div class="k">${k}</div><div class="v mono">${v}<small> ${u}</small></div></div>`).join("");
}

function renderCategorySeg(){
  const counts = {}; CATS.forEach(c=>counts[c]=R.filter(r=>r.category===c).length);
  const btn = (val,label,n)=>`<button data-v="${val}" aria-pressed="${state.category===val||(val===''&&!state.category)}">${label}<span class="n">${n}</span></button>`;
  el("seg-category").innerHTML = btn("","전체",R.length) + CATS.map(c=>btn(c,c,counts[c])).join("");
  el("seg-category").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    state.category = b.dataset.v || null; renderCategorySeg(); render();
  }));
}

function renderGenChips(){
  const gens = (DATA.taxonomy&&DATA.taxonomy.generation)||["Gen III+","Gen IV"];
  el("gen-chips").innerHTML = gens.map(g=>
    `<button class="chip ${g==='Gen IV'?'g4':''}" data-v="${g}" aria-pressed="${state.generation===g}">${g}</button>`).join("");
  el("gen-chips").querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
    state.generation = state.generation===c.dataset.v ? null : c.dataset.v;
    renderGenChips(); render();
  }));
}

function renderSelects(){
  const fams=[...new Set(R.map(r=>r.family))].sort();
  const countries=[...new Set(R.map(r=>r.country))].sort();
  el("f-family").innerHTML = `<option value="">기술계열 전체</option>`+fams.map(f=>`<option value="${f}">${f}</option>`).join("");
  el("f-country").innerHTML = `<option value="">국가 전체</option>`+countries.map(c=>`<option value="${c}">${c}</option>`).join("");
}

function filtered(){
  return R.filter(r=>{
    if(state.category && r.category!==state.category) return false;
    if(state.generation && r.generation!==state.generation) return false;
    if(state.family && r.family!==state.family) return false;
    if(state.country && r.country!==state.country) return false;
    if(state.q){ const q=state.q.toLowerCase();
      if(!(`${r.name} ${r.vendor} ${r.country} ${r.family} ${r.type||''}`.toLowerCase().includes(q))) return false; }
    return true;
  });
}
function sortList(list){
  const s=state.sort;
  return [...list].sort((a,b)=>{
    if(s==="capacity") return b.capacity_mwe_total-a.capacity_mwe_total;
    if(s==="overall"||s==="overallAdj") return b.ev[s]-a.ev[s];
    const da=a.ev.dims.find(d=>d.key===s), db=b.ev.dims.find(d=>d.key===s);
    return db.score-da.score;
  });
}

function miniBars(dims){
  return `<div style="display:flex;gap:3px;margin-top:6px;max-width:260px">`+dims.map(d=>
    `<div title="${d.label}: Lv${d.level}" style="flex:1;height:4px;border-radius:2px;background:color-mix(in srgb, ${scoreColor(d.score)} ${Math.round(levelAlpha(d.level)*100)}%, var(--surface-3))"></div>`).join("")+`</div>`;
}
function radar(dims){
  const N=dims.length, cx=118, cy=110, Rr=80;
  const pt=(i,rad)=>{const a=-Math.PI/2+i*2*Math.PI/N; return [cx+Math.cos(a)*rad, cy+Math.sin(a)*rad];};
  let grid=""; [0.25,0.5,0.75,1].forEach(g=>{ const p=dims.map((_,i)=>pt(i,Rr*g).map(n=>n.toFixed(1)).join(",")).join(" ");
    grid+=`<polygon points="${p}" fill="none" stroke="var(--line-2)" stroke-width="1" opacity=".6"/>`; });
  let axes="",labels="";
  dims.forEach((d,i)=>{ const [x,y]=pt(i,Rr);
    axes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line-2)" stroke-width="1" opacity=".5"/>`;
    const [lx,ly]=pt(i,Rr+15); labels+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="9.5" fill="var(--ink-2)" text-anchor="middle" dominant-baseline="middle" font-family="var(--mono)">${d.label_en}</text>`; });
  const poly=dims.map((d,i)=>pt(i,Rr*d.score/100).map(n=>n.toFixed(1)).join(",")).join(" ");
  const dots=dims.map((d,i)=>{const[x,y]=pt(i,Rr*d.score/100);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="var(--accent)"/>`;}).join("");
  return `<svg viewBox="0 0 236 220" width="236" height="220" role="img" aria-label="차원별 레이더">${grid}${axes}<polygon points="${poly}" fill="color-mix(in srgb, var(--accent) 22%, transparent)" stroke="var(--accent)" stroke-width="2"/>${dots}${labels}</svg>`;
}

function curatedLevel(r, dim){ const d=r.dimensions[dim]; return d?d.level:null; }
function reviewFlag(r){
  const h=r.live&&r.live.status_hint; if(!h) return null;
  const cur=curatedLevel(r, h.dimension);
  return (cur!==null && h.suggested_level>cur) ? h : null;
}
function arisHTML(a){
  if(!a) return "";
  const row=(k,v)=> v?`<span class="ar-k">${k}</span><span class="ar-v">${v}</span>`:"";
  const specs=[
    row("설계기관", a.org), row("설계성숙도", a.design_status),
    row("정격출력", a.net_mwe!=null?`${a.net_mwe} MWe`:null),
    row("노형/냉각재", [a.type,a.coolant,a.spectrum].filter(Boolean).join(" · ")||null),
    row("연료", a.fuel), row("농축도", a.enrichment!=null?`${a.enrichment}%`:null),
  ].filter(Boolean).join("");
  return `<div class="aris-box"><div class="lh"><span class="dot" style="background:var(--accent)"></span>IAEA ARIS · 공식 설계 스펙</div>
    <div class="ar-grid">${specs}</div>
    <div class="ar-note">* 설계성숙도는 IAEA 설계 라벨(실시간 프로젝트 상태 아님) · 출처 <a href="https://aris.iaea.org/" target="_blank" rel="noopener">aris.iaea.org</a></div></div>`;
}
function liveHTML(r){
  const lv=r.live; if(!lv) return "";
  const news=(lv.news||[]).filter(n=>n.title);
  const flag=reviewFlag(r);
  if(!news.length && !lv.wiki && !flag && !lv.aris) return "";
  let h=`<div class="live-box"><div class="lh"><span class="dot"></span>자동수집 신호 · Wikipedia + Google News</div>`;
  if(flag) h+=`<div class="hint"><b>상태 변화 감지:</b> ${flag.label} → ${flag.dimension} 제안 Lv${flag.suggested_level} (현재 큐레이션 Lv${curatedLevel(r,flag.dimension)}). 근거: ${flag.evidence}</div>`;
  h+=news.map(n=>`<div class="live-item"><span class="d">${n.date||'—'}</span>
    <span><a href="${n.url}" target="_blank" rel="noopener">${n.title}</a> <span class="sc">· ${n.source||''}</span></span></div>`).join("");
  if(lv.wiki&&lv.wiki.url) h+=`<div class="live-item"><span class="d">위키</span><span><a href="${lv.wiki.url}" target="_blank" rel="noopener">${lv.wiki.title||'Wikipedia'}</a> <span class="sc">· 최종수정 ${(lv.wiki.modified||'').slice(0,10)}</span></span></div>`;
  h+=`</div>`;
  h+=arisHTML(lv.aris);
  return h;
}
function rowHTML(r, rank){
  const ev=r.ev; const sc=scoreColor(ev.overall); const g4=r.generation==="Gen IV";
  const rf=reviewFlag(r);
  return `<div class="row" data-id="${r.id}">
    <button class="row-head" aria-expanded="false">
      <span class="rank ${rank<=3?'top':''} mono">${rank}</span>
      <span class="r-id">
        <span class="nm">${r.name}</span>
        <span class="meta">${r.vendor} · ${capText(r)} · ${r.coolant}</span>
        ${miniBars(ev.dims)}
      </span>
      <span class="tags">
        <span class="tag gen ${g4?'g4':''}">${r.generation}</span>
        <span class="tag fam">${r.family}</span>
        <span class="tag">${r.country}</span>
        <span class="tag status ${statusClass(r.status)}">${r.status}</span>
        ${rf?`<span class="review-flag" title="자동수집 상태 변화 감지">↑검토</span>`:''}
      </span>
      <span class="score-cell">
        <span class="score-num mono" style="color:${sc}">${ev.overall}</span>
        <span class="bar"><i style="width:${ev.overall}%;background:${sc}"></i></span>
      </span>
      <span class="conf ${ev.dataConfidence}">${{high:'신뢰 高',medium:'신뢰 中',low:'신뢰 低'}[ev.dataConfidence]}</span>
      <svg class="caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    <div class="detail">
      <div class="summary">${r.summary}</div>
      <div class="radar-box"><div class="cap mono">6개 차원 프로파일</div>${radar(ev.dims)}
        <div class="mono" style="font-size:12px;color:var(--ink-2)">종합 <b style="color:${sc};font-size:15px">${ev.overall}</b> · 신뢰도보정 ${ev.overallAdj}</div></div>
      <div class="dim-list">${ev.dims.map(d=>`<div class="dim">
        <span class="dl">${d.label}<small>${d.label_en} · 가중 ${Math.round(d.weight*100)}%</small></span>
        <span class="lvl">Lv<b>${d.level}</b> <span class="conf ${d.confidence}" style="font-size:9px;padding:1px 5px">${{high:'高',medium:'中',low:'低'}[d.confidence]}</span></span>
        <span class="rat">${d.rationale}</span></div>`).join("")}</div>
      <div class="src-row"><span>출처:</span>${r.sources.map(s=>`<span class="s">${s}</span>`).join("")}
        <span style="margin-left:auto">FOAK: ${r.foak_target} · 연료: ${r.fuel}</span></div>
      ${liveHTML(r)}
    </div></div>`;
}

function render(){
  const list = filtered();
  el("count-line").textContent = `${list.length}개 노형 표시 중` + (list.length<R.length?` (전체 ${R.length}개 중)`:"");
  const area = el("list-area");
  if(state.group){
    let html="";
    CATS.forEach(cat=>{
      const g = sortList(list.filter(r=>r.category===cat));
      if(!g.length) return;
      const avg=(g.reduce((a,b)=>a+b.ev.overall,0)/g.length).toFixed(1);
      html += `<div class="group-head"><h3 style="color:${CAT_COLOR[cat]}">${cat}</h3><span class="gc">${g.length}개 · 평균 ${avg}</span><span class="bar-mini"></span></div>`;
      html += `<div class="list">`+g.map((r,i)=>rowHTML(r,i+1)).join("")+`</div>`;
    });
    area.innerHTML = html || `<div class="count-line">해당 조건의 노형이 없습니다.</div>`;
  } else {
    const sorted = sortList(list);
    area.innerHTML = `<div class="list">`+sorted.map((r,i)=>rowHTML(r,i+1)).join("")+`</div>`;
  }
  area.querySelectorAll(".row-head").forEach(h=>h.addEventListener("click",()=>{
    const row=h.closest(".row"); const open=row.hasAttribute("open");
    if(open){row.removeAttribute("open"); h.setAttribute("aria-expanded","false");}
    else{row.setAttribute("open",""); h.setAttribute("aria-expanded","true");}
  }));
}

function renderHeat(){
  const list=[...R].sort((a,b)=>b.ev.overall-a.ev.overall);
  const head=`<thead><tr><th class="name">노형</th>${DIMS.map(d=>`<th>${d.label}</th>`).join("")}<th>종합</th></tr></thead>`;
  const body="<tbody>"+list.map(r=>{
    const cells=r.ev.dims.map(d=>{
      const bg=`color-mix(in srgb, ${scoreColor(d.score)} ${Math.round(levelAlpha(d.level)*100)}%, var(--surface))`;
      const dot={high:"var(--good)",medium:"var(--warn)",low:"var(--crit)"}[d.confidence];
      const tc=d.level>=4?"#fff":"var(--ink)";
      return `<td><span class="cell" style="background:${bg};color:${tc}" title="${d.label} Lv${d.level}/${d.confidence}">${d.level}<span class="dot" style="background:${dot}"></span></span></td>`;
    }).join("");
    const catC=CAT_COLOR[r.category]||"var(--neutral)";
    return `<tr><td class="name">${r.name} <span class="heat-cat" style="background:${catC}">${r.generation}</span><br><small>${r.country} · ${r.family}</small></td>${cells}<td class="ov" style="color:${scoreColor(r.ev.overall)}">${r.ev.overall}</td></tr>`;
  }).join("")+"</tbody>";
  el("heat").innerHTML=head+body;
  el("legend").innerHTML = `
    <div class="it"><span class="sw" style="background:color-mix(in srgb,var(--accent) 18%,var(--surface))"></span>Lv1 개념</div>
    <div class="it"><span class="sw" style="background:color-mix(in srgb,var(--accent) 55%,var(--surface))"></span>Lv3 상세설계</div>
    <div class="it"><span class="sw" style="background:color-mix(in srgb,var(--accent) 96%,var(--surface))"></span>Lv5 실증/운전</div>
    <div class="it"><span class="sw" style="background:var(--good);width:8px;height:8px;border-radius:50%"></span>신뢰 高</div>
    <div class="it"><span class="sw" style="background:var(--warn);width:8px;height:8px;border-radius:50%"></span>中</div>
    <div class="it"><span class="sw" style="background:var(--crit);width:8px;height:8px;border-radius:50%"></span>低</div>`;
}

function renderSources(){

    <div class="top"><span class="nm">${s.name}</span><span class="st ${s.connected?'on':'off'}">${s.connected?'연결됨':'연결 대기'}</span></div>
    <div class="note">${s.note}</div>
    <div class="prov">${s.provides.map(p=>`<span>${p}</span>`).join("")}</div>
    <div style="margin-top:8px"><a href="${s.homepage}" target="_blank" rel="noopener" style="font-size:11.5px">${s.homepage.replace(/^https?:\/\//,'')}</a></div>
  </div>`).join("");
}

(function(){
  let t=null; try{t=localStorage.getItem("smr-theme");}catch(e){}
  if(t) document.documentElement.setAttribute("data-theme",t);
  el("theme").addEventListener("click",()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const dark=cur? cur==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const next=dark?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem("smr-theme",next);}catch(e){}
  });
})();
